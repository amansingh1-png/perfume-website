<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROZANA — Checkout</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><a class="logo" href="index.html">ROZANA<span>.</span><small>PERFUME FOR YOUR EVERYDAY</small></a><div class="secure">Secure checkout · ROZANA</div></header>
<main class="checkout"><div><p class="eyebrow">CHECKOUT</p><h1>Complete your order.</h1><form id="checkoutForm" onsubmit="placeOrder(event)"><div class="form-card"><h3>1. Shipping information</h3><input required id="fullName" placeholder="Full name"><input required id="phone" placeholder="Phone number"><input required id="email" type="email" placeholder="Email address"><textarea required id="address" placeholder="Full delivery address"></textarea><div class="two"><input required id="city" placeholder="City"><input required id="pin" placeholder="Pincode"></div></div><div class="form-card"><h3>2. Payment method</h3><label class="radio"><input type="radio" name="payment" value="UPI" checked> UPI / QR <span>Google Pay · PhonePe · Paytm</span></label><label class="radio"><input type="radio" name="payment" value="CARD"> Credit / Debit Card</label><label class="radio"><input type="radio" name="payment" value="COD"> Cash on Delivery</label><p class="small">Online payments are ready for gateway integration. Add your Razorpay/other gateway keys before accepting live online payments.</p></div><label class="check"><input required type="checkbox"> I agree to the Terms, Privacy Policy and ROZANA order policy.</label><button class="btn gold full" type="submit">Place Order →</button></form></div><aside class="summary"><h3>Your Order</h3><div id="checkoutItems"></div><hr><div class="total"><span>Total</span><b id="checkoutTotal">₹0</b></div></aside></main><script src="script.js"></script><script>renderCheckout();</script></body></html>
